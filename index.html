<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FitForge — browse 1,500+ exercises, filter by body part, muscle and equipment, build workout plans and track your training stats."
    />
    <meta name="theme-color" content="#ea580c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://oss.exercisedb.dev" crossorigin />
    <title>FitForge — Exercise Library & Workout Planner</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Must stay in sync with STORAGE_KEY in src/app/persistence.ts.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('fitforge:state:v1') || 'null')
          var mode = (saved && saved.theme && saved.theme.mode) || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
